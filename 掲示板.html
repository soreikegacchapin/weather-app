<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>掲示板</title>
<style>
  :root {
    --bg-top: #4a90d9;
    --bg-bottom: #8ec5ea;
    --card-bg: rgba(255, 255, 255, 0.16);
    --card-border: rgba(255, 255, 255, 0.35);
    --text-main: #ffffff;
    --text-sub: rgba(255, 255, 255, 0.85);
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    height: 100%;
  }

  body {
    margin: 0;
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic",
      "Meiryo", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 24px 16px;
    background: linear-gradient(160deg, var(--bg-top) 0%, var(--bg-bottom) 55%, #d7ecfb 100%);
    background-attachment: fixed;
    color: var(--text-main);
  }

  .app {
    width: 100%;
    max-width: 520px;
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 28px;
    padding: 28px 24px 24px;
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
  }

  .app-title {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--text-sub);
    margin: 0 0 18px;
    text-transform: uppercase;
  }

  .account-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 18px;
    font-size: 12.5px;
    color: var(--text-sub);
  }

  .account-email {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .logout-btn {
    appearance: none;
    border: 1px solid rgba(255, 255, 255, 0.4);
    background: rgba(255, 255, 255, 0.12);
    color: var(--text-main);
    font-size: 12px;
    padding: 5px 14px;
    border-radius: 14px;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
  }

  .auth-form {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .auth-desc {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.7;
    margin: 0 0 4px;
    text-align: center;
  }

  .auth-form input {
    appearance: none;
    border: 1px solid rgba(255, 255, 255, 0.4);
    background: rgba(255, 255, 255, 0.12);
    color: var(--text-main);
    font-size: 14px;
    padding: 10px 14px;
    border-radius: 14px;
    font-family: inherit;
    outline: none;
  }

  .auth-form input::placeholder {
    color: rgba(255, 255, 255, 0.6);
  }

  .auth-btn {
    appearance: none;
    border: 1px solid rgba(255, 255, 255, 0.5);
    background: rgba(255, 255, 255, 0.92);
    color: #2c5c8f;
    font-size: 13.5px;
    font-weight: 700;
    padding: 10px 22px;
    border-radius: 20px;
    cursor: pointer;
    font-family: inherit;
    transition: transform 0.15s ease;
  }

  .auth-btn:active {
    transform: scale(0.97);
  }

  .auth-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .auth-status {
    text-align: center;
    font-size: 12.5px;
    color: var(--text-sub);
    min-height: 16px;
  }

  .post-form {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 22px;
  }

  .post-form input,
  .post-form textarea {
    appearance: none;
    border: 1px solid rgba(255, 255, 255, 0.4);
    background: rgba(255, 255, 255, 0.12);
    color: var(--text-main);
    font-size: 14px;
    padding: 10px 14px;
    border-radius: 14px;
    font-family: inherit;
    outline: none;
  }

  .post-form input::placeholder,
  .post-form textarea::placeholder {
    color: rgba(255, 255, 255, 0.6);
  }

  .post-form textarea {
    resize: vertical;
    min-height: 70px;
  }

  .post-btn {
    align-self: flex-end;
    appearance: none;
    border: 1px solid rgba(255, 255, 255, 0.5);
    background: rgba(255, 255, 255, 0.92);
    color: #2c5c8f;
    font-size: 13.5px;
    font-weight: 700;
    padding: 9px 22px;
    border-radius: 20px;
    cursor: pointer;
    font-family: inherit;
    transition: transform 0.15s ease, box-shadow 0.25s ease;
  }

  .post-btn:active {
    transform: scale(0.96);
  }

  .post-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .divider {
    border: none;
    border-top: 1px solid rgba(255, 255, 255, 0.25);
    margin: 0 0 18px;
  }

  .post-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
    max-height: 55vh;
    overflow-y: auto;
    padding-right: 4px;
  }

  .post-item {
    background: rgba(255, 255, 255, 0.14);
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 16px;
    padding: 14px 16px;
    animation: fadeIn 0.35s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .post-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 6px;
  }

  .post-name {
    font-size: 14px;
    font-weight: 700;
  }

  .post-time {
    font-size: 11px;
    color: var(--text-sub);
    white-space: nowrap;
  }

  .post-body {
    font-size: 14px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .post-delete {
    appearance: none;
    border: none;
    background: none;
    color: rgba(255, 255, 255, 0.6);
    font-size: 11px;
    cursor: pointer;
    padding: 6px 0 0;
    text-align: right;
    width: 100%;
    font-family: inherit;
  }

  .post-delete:hover {
    color: #fff;
    text-decoration: underline;
  }

  .empty-msg {
    text-align: center;
    font-size: 13.5px;
    color: var(--text-sub);
    padding: 30px 0;
  }

  .status-line {
    text-align: center;
    font-size: 12.5px;
    color: var(--text-sub);
    padding: 10px 0;
  }

  .post-list::-webkit-scrollbar {
    width: 6px;
  }

  .post-list::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.35);
    border-radius: 3px;
  }

  .hidden {
    display: none !important;
  }
</style>
</head>
<body>

<div class="app">
  <div class="card">
    <p class="app-title">💬 掲示板</p>

    <div id="authSection">
      <p class="auth-desc">メールアドレスでログインしてください。<br>入力すると、ログイン用のリンクが届きます。</p>
      <form class="auth-form" id="authForm">
        <input type="email" id="emailInput" placeholder="メールアドレス" required>
        <button type="submit" class="auth-btn" id="authBtn">ログインリンクを送る</button>
        <div class="auth-status" id="authStatus"></div>
      </form>
    </div>

    <div id="boardSection" class="hidden">
      <div class="account-bar">
        <span class="account-email" id="accountEmail"></span>
        <button class="logout-btn" id="logoutBtn">ログアウト</button>
      </div>

      <form class="post-form" id="postForm">
        <input type="text" id="nameInput" placeholder="お名前（省略可）" maxlength="30">
        <textarea id="bodyInput" placeholder="メッセージを入力してください" maxlength="1000" required></textarea>
        <button type="submit" class="post-btn" id="submitBtn">投稿する</button>
      </form>

      <hr class="divider">

      <div class="post-list" id="postList">
        <div class="status-line">読み込み中…</div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://qmrhcuwpugsqzhwigagi.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFtcmhjdXdwdWdzcXpod2lnYWdpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3ODkzNDYsImV4cCI6MjEwNTM2NTM0Nn0.S4hAwQ6ZPJdiljak_q6HTIgvraUXRx6u7m5iL0KaVnc";

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function escapeHtml(str) {
    return str
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function formatTime(iso) {
    const d = new Date(iso);
    const pad = n => String(n).padStart(2, "0");
    return `${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  const authSection = document.getElementById("authSection");
  const authForm = document.getElementById("authForm");
  const emailInput = document.getElementById("emailInput");
  const authBtn = document.getElementById("authBtn");
  const authStatus = document.getElementById("authStatus");

  const boardSection = document.getElementById("boardSection");
  const accountEmail = document.getElementById("accountEmail");
  const logoutBtn = document.getElementById("logoutBtn");

  const listEl = document.getElementById("postList");
  const formEl = document.getElementById("postForm");
  const nameInput = document.getElementById("nameInput");
  const bodyInput = document.getElementById("bodyInput");
  const submitBtn = document.getElementById("submitBtn");

  let currentUser = null;
  let channel = null;

  function renderPosts(posts) {
    if (!posts || posts.length === 0) {
      listEl.innerHTML = `<div class="empty-msg">まだ投稿がありません。<br>最初のメッセージを書いてみましょう。</div>`;
      return;
    }
    listEl.innerHTML = posts
      .map(post => {
        const displayName = post.name || (post.email ? post.email.split("@")[0] : "名無しさん");
        const canDelete = currentUser && post.user_id === currentUser.id;
        return `
        <div class="post-item" data-id="${post.id}">
          <div class="post-head">
            <span class="post-name">${escapeHtml(displayName)}</span>
            <span class="post-time">${formatTime(post.created_at)}</span>
          </div>
          <div class="post-body">${escapeHtml(post.body)}</div>
          ${canDelete ? `<button class="post-delete" data-id="${post.id}">削除</button>` : ""}
        </div>
      `;
      })
      .join("");
  }

  async function loadPosts() {
    const { data, error } = await sb
      .from("posts")
      .select("*")
      .order("created_at", { ascending: false });
    if (error) {
      listEl.innerHTML = `<div class="empty-msg">読み込みに失敗しました。<br>${escapeHtml(error.message)}</div>`;
      return;
    }
    renderPosts(data);
  }

  function showBoard() {
    authSection.classList.add("hidden");
    boardSection.classList.remove("hidden");
    accountEmail.textContent = currentUser.email;
    if (!channel) {
      channel = sb
        .channel("posts-changes")
        .on("postgres_changes", { event: "*", schema: "public", table: "posts" }, () => loadPosts())
        .subscribe();
    }
    loadPosts();
  }

  function showAuth() {
    boardSection.classList.add("hidden");
    authSection.classList.remove("hidden");
    if (channel) {
      sb.removeChannel(channel);
      channel = null;
    }
  }

  function handleSession(session) {
    currentUser = session ? session.user : null;
    if (currentUser) {
      showBoard();
    } else {
      showAuth();
    }
  }

  authForm.addEventListener("submit", async e => {
    e.preventDefault();
    const email = emailInput.value.trim();
    if (!email) return;
    authBtn.disabled = true;
    authStatus.textContent = "送信中…";
    const { error } = await sb.auth.signInWithOtp({
      email,
      options: { emailRedirectTo: window.location.href }
    });
    authBtn.disabled = false;
    if (error) {
      authStatus.textContent = "エラー：" + error.message;
      return;
    }
    authStatus.textContent = "ログイン用のリンクを送信しました。メールをご確認ください。";
  });

  logoutBtn.addEventListener("click", async () => {
    await sb.auth.signOut();
  });

  formEl.addEventListener("submit", async e => {
    e.preventDefault();
    const body = bodyInput.value.trim();
    if (!body || !currentUser) return;
    submitBtn.disabled = true;
    const { error } = await sb.from("posts").insert({
      name: nameInput.value.trim(),
      body,
      user_id: currentUser.id,
      email: currentUser.email
    });
    submitBtn.disabled = false;
    if (error) {
      alert("投稿に失敗しました：" + error.message);
      return;
    }
    bodyInput.value = "";
    loadPosts();
  });

  listEl.addEventListener("click", async e => {
    if (!e.target.classList.contains("post-delete")) return;
    const id = e.target.dataset.id;
    const { error } = await sb.from("posts").delete().eq("id", id);
    if (error) {
      alert("削除に失敗しました：" + error.message);
      return;
    }
    loadPosts();
  });

  sb.auth.onAuthStateChange((_event, session) => {
    handleSession(session);
  });

  sb.auth.getSession().then(({ data: { session } }) => {
    handleSession(session);
  });
</script>

</body>
</html>
